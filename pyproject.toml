[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-gameplay-server"
version = "0.1.0"
description = "Authoritative Python gameplay server for a browser TPS core"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "panda3d>=1.10.16,<2",
    "python-dotenv>=1,<2",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["aster_game*"]

[tool.setuptools.package-data]
aster_game = ["web/*.html"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040"]
